# nginx voor barberiwan.nl, passend bij de vooraf gerenderde build (dist/).
#
# Niet blind overnemen: vergelijk eerst met wat er nu draait
#     sudo nginx -T | less          (zoek op server_name barberiwan.nl)
# Laat de certificaatregels van certbot staan, zet de juiste root, en:
#     sudo nginx -t && sudo systemctl reload nginx
# Zie deploy/README.md voor de controles daarna.

# Cachebeleid per soort bestand. Via een map in plaats van add_header per
# location, omdat add_header in een location de headers hieronder wist.
map $uri $barberiwan_cache {
    ~^/assets/                        "public, max-age=31536000, immutable";
    ~\.(webp|jpg|png|ico|woff2)$      "public, max-age=2592000";
    default                           "no-cache";
}

# http en www gaan in één stap naar https://barberiwan.nl
server {
    listen 80;
    listen [::]:80;
    server_name barberiwan.nl www.barberiwan.nl;
    return 301 https://barberiwan.nl$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.barberiwan.nl;

    # ssl_certificate     /etc/letsencrypt/live/barberiwan.nl/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/barberiwan.nl/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://barberiwan.nl$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name barberiwan.nl;

    # ssl_certificate     /etc/letsencrypt/live/barberiwan.nl/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/barberiwan.nl/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/html/site-v3/dist;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json application/manifest+json image/svg+xml;

    add_header Cache-Control $barberiwan_cache always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Getest met de build: agenda (Salonized), kaart (Google) en lettertypen werken.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src https://barber-iwan-1.salonized.com https://www.google.com; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Adressen van eerdere versies van de site.
    if ($request_uri = /index.html) { return 301 /; }
    location = /terms              { return 301 /algemene-voorwaarden/; }
    location = /en                 { return 301 /; }
    location = /en/                { return 301 /; }
    location = /privacy-verklaring { return 301 /; }
    location = /disclaimer         { return 301 /; }

    # Elke pagina is een map met index.html; /haircuts gaat met een 301 naar
    # /haircuts/. Wat niet bestaat krijgt een echte 404 in plaats van de homepage.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Als de beheer-backend ooit draait (zie DESIGNER-README.md):
    # location /api/ {
    #     proxy_pass http://127.0.0.1:3001/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
